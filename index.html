<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lingua Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
    <meta name="description" content="Neural Multilingual Text Translator powered by Groq LPU inference.">
    <meta name="theme-color" content="#06b6d4">
</head>
<body>
    <header>
        <div class="header-left">
            <i data-lucide="languages" class="logo-icon"></i>
            <h1>Lingua Flow</h1>
        </div>
        <button id="settings-btn" class="icon-btn"><i data-lucide="settings"></i></button>
    </header>

    <main class="container">
        <div class="translator-container">
            <div class="panel source-panel">
                <div class="panel-header">
                    <select id="source-lang">
                        <option value="auto">Auto-detect</option>
                        <option value="English">English</option>
                        <option value="Spanish">Spanish</option>
                        <option value="French">French</option>
                        <option value="German">German</option>
                        <option value="Hindi">Hindi</option>
                        <option value="Japanese">Japanese</option>
                        <option value="Chinese">Chinese</option>
                        <option value="Arabic">Arabic</option>
                        <option value="Portuguese">Portuguese</option>
                        <option value="Korean">Korean</option>
                        <option value="Italian">Italian</option>
                        <option value="Russian">Russian</option>
                        <option value="Turkish">Turkish</option>
                    </select>
                </div>
                <div class="panel-body">
                    <textarea id="source-text" placeholder="Enter text to translate..."></textarea>
                    <div class="panel-footer">
                        <span id="char-count">0 characters</span>
                    </div>
                </div>
            </div>

            <div class="swap-container">
                <button id="swap-btn" class="icon-btn swap-btn"><i data-lucide="arrow-left-right"></i></button>
            </div>

            <div class="panel target-panel">
                <div class="panel-header">
                    <select id="target-lang">
                        <option value="English">English</option>
                        <option value="Spanish">Spanish</option>
                        <option value="French">French</option>
                        <option value="German">German</option>
                        <option value="Hindi">Hindi</option>
                        <option value="Japanese">Japanese</option>
                        <option value="Chinese">Chinese</option>
                        <option value="Arabic">Arabic</option>
                        <option value="Portuguese">Portuguese</option>
                        <option value="Korean">Korean</option>
                        <option value="Italian">Italian</option>
                        <option value="Russian">Russian</option>
                        <option value="Turkish">Turkish</option>
                    </select>
                </div>
                <div class="panel-body">
                    <div id="target-text" class="output-area" placeholder="Translation will appear here..."></div>
                    <div class="panel-footer right-align">
                        <button id="copy-btn" class="icon-btn"><i data-lucide="copy"></i></button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="action-container">
            <button id="translate-btn" class="primary-btn">
                <span class="btn-text">Translate</span>
                <i data-lucide="loader-2" class="spinner hidden"></i>
            </button>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button id="close-settings" class="icon-btn"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="api-key">Groq API Key</label>
                    <input type="password" id="api-key" placeholder="gsk_...">
                    <p class="help-text">Your API key is stored locally in your browser.</p>
                </div>
            </div>
            <div class="modal-footer">
                <button id="save-settings" class="primary-btn">Save</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="app.js"></script>
</body>
</html>
